<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Series 02 — Filanovich Photography</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    header {
      padding: 45px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      letter-spacing: 4px;
    }

    .back {
      color: #aaa;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .back:hover {
      color: #fff;
    }

    .intro {
      padding: 100px 6% 80px;
      text-align: center;
    }

    .intro h1 {
      font-size: clamp(50px, 10vw, 110px);
      font-weight: 300;
      letter-spacing: 6px;
    }

    .intro p {
      margin-top: 25px;
      color: #888;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-size: 12px;
    }

    .gallery {
      padding: 20px 6% 120px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
    }

    .photo {
      aspect-ratio: 4 / 5;
      background: #292929;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 13px;
      letter-spacing: 2px;
    }

    .photo.wide {
      grid-column: span 2;
      aspect-ratio: 16 / 9;
    }

    footer {
      padding: 70px 20px;
      text-align: center;
      border-top: 1px solid #292929;
    }

    footer a {
      color: #aaa;
      text-decoration: none;
      letter-spacing: 2px;
      font-size: 13px;
      text-transform: uppercase;
    }

    footer a:hover {
      color: #fff;
    }

    @media (max-width: 700px) {
      .gallery {
        grid-template-columns: 1fr;
      }

      .photo.wide {
        grid-column: span 1;
      }

      header {
        padding: 30px 6%;
      }
    }
  </style>
</head>

<body>

  <header>
    <a class="logo" href="index.html">FILANOVICH</a>

    <a class="back" href="index.html">
      All Series
    </a>
  </header>

  <section class="intro">
    <h1>SERIES 02</h1>
    <p>Photography</p>
  </section>

  <section class="gallery">

    <div class="photo">
      PHOTO 01
    </div>

    <div class="photo">
      PHOTO 02
    </div>

    <div class="photo wide">
      PHOTO 03
    </div>

    <div class="photo">
      PHOTO 04
    </div>

    <div class="photo">
      PHOTO 05
    </div>

    <div class="photo">
      PHOTO 06
    </div>

  </section>

  <footer>
    <a href="index.html">
      ← Back to all series
    </a>
  </footer>

</body>
</html>
