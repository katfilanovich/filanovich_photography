<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Series 01 — Filanovich Photography</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    header {
      padding: 35px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      letter-spacing: 4px;
    }

    .back {
      color: #888;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: color 0.3s;
    }

    .back:hover {
      color: #fff;
    }

    .intro {
      padding: 80px 5% 70px;
      text-align: center;
    }

    .intro h1 {
      font-size: clamp(45px, 9vw, 105px);
      font-weight: 300;
      letter-spacing: 7px;
    }

    .intro p {
      margin-top: 22px;
      color: #777;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-size: 11px;
    }

    /* GALLERY */

    .gallery {
      width: 90%;
      max-width: 1500px;
      margin: 0 auto;
      padding-bottom: 120px;

      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .photo {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      background: #1b1b1b;
    }

    .photo img {
      width: 100%;
      height: auto;
      display: block;

      transition:
        transform 0.6s ease,
        opacity 0.6s ease;
    }

    .photo:hover img {
      transform: scale(1.025);
      opacity: 0.9;
    }

    .photo.wide {
      grid-column: span 2;
    }

    /* LIGHTBOX */

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.96);

      display: none;
      align-items: center;
      justify-content: center;

      z-index: 1000;
      padding: 70px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .close {
      position: absolute;
      top: 25px;
      right: 35px;

      color: #fff;
      font-size: 35px;
      font-weight: 200;

      cursor: pointer;
      user-select: none;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);

      color: #fff;
      font-size: 45px;
      font-weight: 200;

      cursor: pointer;
      user-select: none;

      padding: 20px;
      opacity: 0.7;

      transition: opacity 0.3s;
    }

    .arrow:hover {
      opacity: 1;
    }

    .prev {
      left: 15px;
    }

    .next {
      right: 15px;
    }

    .counter {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);

      color: #777;
      font-size: 12px;
      letter-spacing: 2px;
    }

    footer {
      padding: 60px 20px;
      text-align: center;
      border-top: 1px solid #222;
    }

    footer a {
      color: #888;
      text-decoration: none;
      letter-spacing: 2px;
      font-size: 12px;
      text-transform: uppercase;
    }

    footer a:hover {
      color: #fff;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      header {
        padding: 25px 6%;
      }

      .intro {
        padding: 60px 6% 50px;
      }

      .gallery {
        width: 92%;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .photo.wide {
        grid-column: span 1;
      }

      .lightbox {
        padding: 40px 20px;
      }

      .lightbox img {
        max-width: 94vw;
        max-height: 80vh;
      }

      .arrow {
        font-size: 32px;
        padding: 10px;
      }

      .prev {
        left: 0;
      }

      .next {
        right: 0;
      }
    }
  </style>
</head>

  <section class="intro">

  <section class="gallery">

    <div class="photo">
      <img src="r001-003.jpg" alt="Series 01 — Photo 01">
    </div>

    <div class="photo wide">

    </div>

    <div class="photo">
      <img src="images/series-01/PHSQUAT10698015.JPG" alt="Series 01 — Photo 05">
    </div>

    <div class="photo">
      <img src="images/series-01/PHSQUAT10698026.JPG" alt="Series 01 — Photo 06">
    </div>

  <!-- FULLSCREEN PHOTO VIEWER -->

  <div class="lightbox" id="lightbox">

    <div class="close" id="close">×</div>

    <div class="arrow prev" id="prev">‹</div>

    <img id="lightboxImage" src="" alt="">

    <div class="arrow next" id="next">›</div>

    <div class="counter" id="counter"></div>

  </div>


  <script>

    const photos = Array.from(
      document.querySelectorAll('.photo img')
    );

    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    const close = document.getElementById('close');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const counter = document.getElementById('counter');

    let currentIndex = 0;


    function openPhoto(index) {

      currentIndex = index;

      lightboxImage.src = photos[currentIndex].src;
      lightboxImage.alt = photos[currentIndex].alt;

      counter.textContent =
        (currentIndex + 1) + ' / ' + photos.length;

      lightbox.classList.add('active');

      document.body.style.overflow = 'hidden';
    }


    function closePhoto() {

      lightbox.classList.remove('active');

      document.body.style.overflow = '';
    }


    function showNext() {

      currentIndex =
        (currentIndex + 1) % photos.length;

      openPhoto(currentIndex);
    }


    function showPrevious() {

      currentIndex =
        (currentIndex - 1 + photos.length) % photos.length;

      openPhoto(currentIndex);
    }


    photos.forEach((photo, index) => {

      photo.parentElement.addEventListener(
        'click',
        () => openPhoto(index)
      );

    });


    next.addEventListener(
      'click',
      showNext
    );


    prev.addEventListener(
      'click',
      showPrevious
    );


    close.addEventListener(
      'click',
      closePhoto
    );


    lightbox.addEventListener(
      'click',
      function(event) {

        if (event.target === lightbox) {
          closePhoto();
        }

      }
    );


    document.addEventListener(
      'keydown',
      function(event) {

        if (!lightbox.classList.contains('active')) {
          return;
        }

        if (event.key === 'Escape') {
          closePhoto();
        }

        if (event.key === 'ArrowRight') {
          showNext();
        }

        if (event.key === 'ArrowLeft') {
          showPrevious();
        }

      }
    );

  </script>

</body>
</html>
