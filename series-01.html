<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ORDINARY DAYS — Filanovich Photography</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    header {
      padding: 40px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      letter-spacing: 4px;
    }

    .back {
      color: #888;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .back:hover {
      color: #fff;
    }

    .intro {
      padding: 90px 6% 100px;
      text-align: center;
    }

    .intro h1 {
      font-size: clamp(42px, 7vw, 82px);
      font-weight: 300;
      letter-spacing: 6px;
    }

    .intro p {
      max-width: 650px;
      margin: 25px auto 0;
      color: #999;
      font-size: 14px;
      line-height: 1.8;
    }

    .film {
      margin-top: 15px !important;
      color: #666 !important;
      font-size: 11px !important;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* GALLERY */

    .gallery {
      width: 88%;
      max-width: 1450px;
      margin: 0 auto;
      padding-bottom: 140px;
    }

    .row {
      display: flex;
      align-items: flex-start;
      gap: 30px;
      margin-bottom: 90px;
    }

    .photo {
      cursor: pointer;
      overflow: hidden;
    }

    .photo img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    .photo:hover img {
      transform: scale(0.98);
      opacity: 0.78;
    }

    .number {
      margin-top: 12px;
      color: #555;
      font-size: 10px;
      letter-spacing: 2px;
    }

    /* 01 + 02 */

    .row-one .photo {
      width: calc(50% - 15px);
    }

    /* 03 + 04
       03 is horizontal and therefore wider.
       04 is vertical and has the same height. */

    .row-two {
      align-items: stretch;
    }

    .row-two .photo:first-child {
      width: 68%;
    }

    .row-two .photo:last-child {
      width: 32%;
    }

    .row-two .photo img {
      height: 100%;
      object-fit: cover;
    }

    /* 05 */

    .row-five {
      display: block;
    }

    .row-five .photo {
      width: 100%;
    }

    /* 06 + 07 */

    .row-six .photo {
      width: calc(50% - 15px);
    }

    /* 08 */

    .row-eight {
      display: block;
      margin-bottom: 0;
    }

    .row-eight .photo {
      width: 100%;
    }

    /* LIGHTBOX */

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.96);

      display: none;
      align-items: center;
      justify-content: center;

      z-index: 1000;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 88vw;
      max-height: 88vh;
      object-fit: contain;
    }

    .close {
      position: fixed;
      top: 25px;
      right: 35px;

      color: #aaa;
      font-size: 32px;
      font-weight: 300;

      cursor: pointer;
      z-index: 1002;
    }

    .close:hover {
      color: #fff;
    }

    .prev,
    .next {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);

      color: #aaa;
      font-size: 38px;
      font-weight: 300;

      cursor: pointer;
      user-select: none;

      z-index: 1002;
    }

    .prev {
      left: 30px;
    }

    .next {
      right: 30px;
    }

    .prev:hover,
    .next:hover {
      color: #fff;
    }

    footer {
      padding: 70px 20px;
      text-align: center;
      border-top: 1px solid #292929;
    }

    footer a {
      color: #777;
      text-decoration: none;
      letter-spacing: 2px;
      font-size: 12px;
      text-transform: uppercase;
    }

    footer a:hover {
      color: #fff;
    }

    /* TABLET */

    @media (max-width: 900px) {

      .row {
        gap: 20px;
        margin-bottom: 65px;
      }

      .row-two .photo:first-child {
        width: 65%;
      }

      .row-two .photo:last-child {
        width: 35%;
      }
    }

    /* PHONE */

    @media (max-width: 600px) {

      header {
        padding: 30px 6%;
      }

      .intro {
        padding: 75px 7% 70px;
      }

      .intro h1 {
        font-size: 42px;
        letter-spacing: 4px;
      }

      .intro p {
        font-size: 13px;
      }

      .gallery {
        width: 88%;
      }

      .row,
      .row-one,
      .row-two,
      .row-six {
        display: block;
        margin-bottom: 70px;
      }

      .row-one .photo,
      .row-two .photo:first-child,
      .row-two .photo:last-child,
      .row-six .photo,
      .row-five .photo,
      .row-eight .photo {
        width: 100%;
        margin-bottom: 45px;
      }

      .row-two .photo img {
        height: auto;
        object-fit: contain;
      }

      .row .photo:last-child {
        margin-bottom: 0;
      }

      .lightbox img {
        max-width: 94vw;
        max-height: 85vh;
      }

      .prev {
        left: 12px;
      }

      .next {
        right: 12px;
      }

      .close {
        right: 20px;
      }
    }
  </style>
</head>

<body>

  <header>

    <a class="logo" href="index.html">
      FILANOVICH
    </a>

    <a class="back" href="index.html">
      All Series
    </a>

  </header>


  <section class="intro">

    <h1>ORDINARY DAYS</h1>

    <p>
      Everyday life between solitude and togetherness,
      choices and paths, and the quiet life unfolding
      around us.
    </p>

    <p class="film">
      Captured on black and white film
    </p>

  </section>


  <main class="gallery">


    <!-- 01 + 02 -->

    <section class="row row-one">

      <div class="photo" data-index="0">

        <img
          src="r001-003.jpg"
          alt="Ordinary Days — 01"
        >

        <div class="number">01 / 08</div>

      </div>


      <div class="photo" data-index="1">

        <img
          src="images/series-01/PHSQUAT10698007.JPG"
          alt="Ordinary Days — 02"
        >

        <div class="number">02 / 08</div>

      </div>

    </section>


    <!-- 03 + 04 -->

    <section class="row row-two">

      <div class="photo" data-index="2">

        <img
          src="images/series-01/PHSQUAT10698011.JPG"
          alt="Ordinary Days — 03"
        >

        <div class="number">03 / 08</div>

      </div>


      <div class="photo" data-index="3">

        <img
          src="images/series-01/PHSQUAT10698012.JPG"
          alt="Ordinary Days — 04"
        >

        <div class="number">04 / 08</div>

      </div>

    </section>


    <!-- 05 -->

    <section class="row row-five">

      <div class="photo" data-index="4">

        <img
          src="images/series-01/PHSQUAT10698015.JPG"
          alt="Ordinary Days — 05"
        >

        <div class="number">05 / 08</div>

      </div>

    </section>


    <!-- 06 + 07 -->

    <section class="row row-six">

      <div class="photo" data-index="5">

        <img
          src="images/series-01/PHSQUAT10698026.JPG"
          alt="Ordinary Days — 06"
        >

        <div class="number">06 / 08</div>

      </div>


      <div class="photo" data-index="6">

        <img
          src="images/series-01/r001-033о.jpg"
          alt="Ordinary Days — 07"
        >

        <div class="number">07 / 08</div>

      </div>

    </section>


    <!-- 08 -->

    <section class="row row-eight">

      <div class="photo" data-index="7">

        <img
          src="images/series-01/PHSQUAT10698036.JPG"
          alt="Ordinary Days — 08"
        >

        <div class="number">08 / 08</div>

      </div>

    </section>


  </main>


  <!-- LIGHTBOX -->

  <div class="lightbox" id="lightbox">

    <div class="close" id="close">×</div>

    <div class="prev" id="prev">‹</div>

    <img id="lightboxImage" src="" alt="">

    <div class="next" id="next">›</div>

  </div>


  <footer>

    <a href="index.html">
      ← Back to all series
    </a>

  </footer>


  <script>

    const photos = document.querySelectorAll(".photo");

    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");

    const close = document.getElementById("close");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");

    let currentIndex = 0;


    function openLightbox(index) {

      currentIndex = index;

      const image =
        photos[currentIndex].querySelector("img");

      lightboxImage.src = image.src;

      lightbox.classList.add("active");
    }


    function closeLightbox() {

      lightbox.classList.remove("active");
    }


    function showNext() {

      currentIndex++;

      if (currentIndex >= photos.length) {
        currentIndex = 0;
      }

      const image =
        photos[currentIndex].querySelector("img");

      lightboxImage.src = image.src;
    }


    function showPrevious() {

      currentIndex--;

      if (currentIndex < 0) {
        currentIndex = photos.length - 1;
      }

      const image =
        photos[currentIndex].querySelector("img");

      lightboxImage.src = image.src;
    }


    photos.forEach((photo, index) => {

      photo.addEventListener("click", () => {
        openLightbox(index);
      });

    });


    close.addEventListener("click", closeLightbox);

    next.addEventListener("click", showNext);

    prev.addEventListener("click", showPrevious);


    lightbox.addEventListener("click", (event) => {

      if (event.target === lightbox) {
        closeLightbox();
      }

    });


    document.addEventListener("keydown", (event) => {

      if (!lightbox.classList.contains("active")) {
        return;
      }

      if (event.key === "Escape") {
        closeLightbox();
      }

      if (event.key === "ArrowRight") {
        showNext();
      }

      if (event.key === "ArrowLeft") {
        showPrevious();
      }

    });

  </script>

</body>
</html>
