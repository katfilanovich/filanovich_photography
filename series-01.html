<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Series 01 — Filanovich Photography</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    header {
      padding: 45px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      letter-spacing: 4px;
    }

    .back {
      color: #aaa;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .back:hover {
      color: #fff;
    }

    .intro {
      padding: 100px 6% 80px;
      text-align: center;
    }

    .intro h1 {
      font-size: clamp(50px, 10vw, 110px);
      font-weight: 300;
      letter-spacing: 6px;
    }

    .intro p {
      margin-top: 25px;
      color: #888;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-size: 12px;
    }

    .gallery {
      padding: 20px 6% 120px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
    }

    .photo {
      width: 100%;
      background: #292929;
      overflow: hidden;
    }

    .photo img {
      width: 100%;
      height: auto;
      display: block;
    }

    .placeholder {
      aspect-ratio: 4 / 5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 13px;
      letter-spacing: 2px;
    }

    .wide {
      grid-column: span 2;
    }

    footer {
      padding: 70px 20px;
      text-align: center;
      border-top: 1px solid #292929;
    }

    footer a {
      color: #aaa;
      text-decoration: none;
      letter-spacing: 2px;
      font-size: 13px;
      text-transform: uppercase;
    }

    footer a:hover {
      color: #fff;
    }

    @media (max-width: 700px) {
      .gallery {
        grid-template-columns: 1fr;
      }

      .wide {
        grid-column: span 1;
      }

      header {
        padding: 30px 6%;
      }
    }
  </style>
</head>

<body>

  <header>
    <a class="logo" href="index.html">FILANOVICH</a>

    <a class="back" href="index.html">
      All Series
    </a>
  </header>

  <section class="intro">

    <p>Photography</p>
  </section>

  <section class="gallery">

  </div>

  <div class="photo">

  </div>

  <div class="photo wide">

  </div>

  <div class="photo">

  </div>

  <div class="photo">
    <img src="images/series-01/PHSQUAT10698015.JPG" alt="Series 01 — Photo 05">
  </div>

  <div class="photo">
    <img src="images/series-01/PHSQUAT10698026.JPG" alt="Series 01 — Photo 06">
  </div>

  <div class="photo">

  </div>

</section>

</body>
</html>
