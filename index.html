<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Filanovich Photography</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    header {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: clamp(55px, 12vw, 150px);
      font-weight: 300;
      letter-spacing: 8px;
    }

    .subtitle {
      margin-top: 25px;
      color: #aaa;
      letter-spacing: 5px;
      text-transform: uppercase;
      font-size: 13px;
    }

    .series {
      padding: 100px 6%;
    }

    .series-title {
      font-size: 42px;
      font-weight: 300;
      margin-bottom: 60px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
    }

    .card {
      position: relative;
      height: 600px;
      overflow: hidden;

      display: flex;
      align-items: flex-end;

      text-decoration: none;
      color: white;

      background: #292929;

      transition: transform 0.4s ease;
    }

    .card:hover {
      transform: scale(0.985);
    }

    .card-image {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      transition:
        transform 0.7s ease,
        opacity 0.7s ease;
    }

    .card:hover .card-image {
      transform: scale(1.035);
    }

    .overlay {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to top,
          rgba(0,0,0,0.85) 0%,
          rgba(0,0,0,0.35) 45%,
          rgba(0,0,0,0.05) 100%
        );

      transition: background 0.4s ease;
    }

    .card:hover .overlay {
      background:
        linear-gradient(
          to top,
          rgba(0,0,0,0.9) 0%,
          rgba(0,0,0,0.45) 55%,
          rgba(0,0,0,0.15) 100%
        );
    }

    .card-content {
      position: relative;
      z-index: 2;

      padding: 35px;
      max-width: 650px;
    }

    .card h2 {
      font-size: 32px;
      font-weight: 300;
      letter-spacing: 2px;
    }

    .description {
      margin-top: 18px;

      max-width: 560px;

      color: #ddd;
      font-size: 14px;
      line-height: 1.7;
      letter-spacing: 0.5px;

      opacity: 0.9;
    }

    .coming-soon {
      color: #777;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 15px;
    }

    footer {
      padding: 70px 20px;
      text-align: center;
      color: #777;
      letter-spacing: 2px;
    }

    @media (max-width: 700px) {

      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        height: 500px;
      }

      .series {
        padding: 70px 6%;
      }

      .series-title {
        font-size: 34px;
        margin-bottom: 40px;
      }

      .card-content {
        padding: 25px;
      }

      .card h2 {
        font-size: 27px;
      }

      .description {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div>
      <h1>FILANOVICH</h1>
      <p class="subtitle">Photography</p>
    </div>
  </header>


  <section class="series">

    <h2 class="series-title">Selected Series</h2>

    <div class="grid">


      <!-- SERIES 01 -->

      <a class="card" href="series-01.html">

        <img
          class="card-image"
          src="r001-003.jpg"
          alt="Series 01"
        >

        <div class="overlay"></div>

        <div class="card-content">

          <h2>SERIES 01</h2>

          <p class="description">
            Everyday life between solitude and togetherness,
            choices and paths, and the quiet life unfolding
            around us. Captured on black and white film.
          </p>

        </div>

      </a>


      <!-- SERIES 02 -->

      <a class="card" href="series-02.html">

        <div class="overlay"></div>

        <div class="card-content">

          <h2>SERIES 02</h2>

          <p class="coming-soon">
            Photography
          </p>

        </div>

      </a>


      <!-- SERIES 03 -->

      <a class="card" href="series-03.html">

        <div class="overlay"></div>

        <div class="card-content">

          <h2>SERIES 03</h2>

          <p class="coming-soon">
            Photography
          </p>

        </div>

      </a>


      <!-- SERIES 04 -->

      <a class="card" href="series-04.html">

        <div class="overlay"></div>

        <div class="card-content">

          <h2>SERIES 04</h2>

          <p class="coming-soon">
            Photography
          </p>

        </div>

      </a>


    </div>

  </section>


  <footer>
    FILANOVICH PHOTOGRAPHY
  </footer>

</body>
</html>
